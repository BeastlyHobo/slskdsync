{% extends 'base.html' %}
{% block content %}

<div class="search-wrap">
  <div class="search-inner">
    <input id="q" class="search-input" type="search"
      placeholder="Search for artist, album, or track…" autocomplete="off" autofocus>
    <button class="search-clear" id="clear-btn" title="Clear">✕</button>
  </div>
  <div class="tab-bar" id="tab-bar">
    <button class="tab active" data-tab="track">Tracks</button>
    <button class="tab" data-tab="artist">Artists</button>
    <button class="tab" data-tab="album">Albums</button>
  </div>
</div>

<!-- search history chips -->
<div id="search-history" style="display:none;padding:.3rem 0 .1rem;display:flex;flex-wrap:wrap;gap:.3rem"></div>

<!-- breadcrumb shown when drilling into artist/album -->
<div id="breadcrumb" class="breadcrumb hidden"></div>

<div id="results-area">
  <div class="empty-state">
    <div class="empty-icon">{{ ic.icon('music', 40) }}</div>
    <p>Search to discover music,<br>then download via Soulseek or TIDAL</p>
  </div>
</div>

<style>
/* Song page */
.song-hero { display:flex; gap:1rem; align-items:flex-end; margin:.4rem 0 .8rem; }
.song-cover { width:132px; height:132px; flex-shrink:0; border-radius:var(--radius-sm);
  object-fit:cover; background:var(--surface2); box-shadow:var(--shadow-lg); }
.song-cover-ph { display:flex; align-items:center; justify-content:center; color:var(--text-muted); }
.song-hero-info { min-width:0; flex:1; }
.song-kicker { font-size:.6875rem; font-weight:700; color:var(--text-faint);
  text-transform:uppercase; letter-spacing:.06em; }
.song-title { font-size:1.3rem; font-weight:800; line-height:1.15; letter-spacing:-.01em;
  margin:.15rem 0 .3rem; overflow-wrap:anywhere; }
.song-version { font-weight:600; color:var(--text-muted); font-size:.95rem; }
.song-by { font-size:.85rem; color:var(--text-muted); }
.song-meta { font-size:.75rem; color:var(--text-faint); margin-top:.25rem; }
.song-status { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; font-size:.8rem;
  font-weight:600; padding:.55rem .75rem; border-radius:var(--radius-sm);
  background:var(--surface2); border:1px solid var(--border); margin-bottom:.7rem; }
.song-status.ok { color:var(--ok); }
.song-status-link { margin-left:auto; font-weight:600; }
.song-preview { width:100%; height:40px; margin-bottom:.2rem; }
.song-hint { font-size:.6875rem; color:var(--text-faint); margin-bottom:.7rem; }
.song-facts { display:grid; grid-template-columns:auto 1fr; gap:.32rem .9rem; font-size:.78rem;
  padding:.7rem .8rem; background:var(--surface2); border-radius:var(--radius-sm); margin:.8rem 0; }
.song-facts .k { color:var(--text-faint); white-space:nowrap; }
.song-facts .v { color:var(--text); overflow-wrap:anywhere; }
.song-section { display:flex; justify-content:space-between; align-items:baseline; gap:.5rem;
  margin:1.1rem 0 .45rem; }
.song-section .track-link { font-size:.75rem; text-transform:none; letter-spacing:0; font-weight:600; }
.track-card[data-action="song"], .top-track-row[data-action="song"] { cursor:pointer; }
.track-card.track-current { border-color:var(--accent); }
</style>

<script>
const input = document.getElementById('q');
const clearBtn = document.getElementById('clear-btn');
const area = document.getElementById('results-area');
const breadcrumbEl = document.getElementById('breadcrumb');
const tabBar = document.getElementById('tab-bar');

let activeTab = 'track';
let debounce = null;
let navStack = [];

// Library index: Set of "artist||title" keys for already-downloaded check
// ── Search history ────────────────────────────────────────────────────────
const HISTORY_KEY = 'search_history';
const historyEl = document.getElementById('search-history');
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; } }
function saveHistory(q) {
  let h = loadHistory().filter(x => x !== q);
  h.unshift(q);
  h = h.slice(0, 10);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  if (!h.length) { historyEl.style.display = 'none'; return; }
  historyEl.style.display = 'flex';
  historyEl.innerHTML = h.map(q =>
    `<button class="hist-chip" onclick="useHistory(this)">${esc(q)}</button>`
  ).join('');
}
function useHistory(btn) {
  input.value = btn.textContent;
  clearBtn.classList.add('visible');
  navStack = [];
  renderBreadcrumb();
  triggerSearch(btn.textContent);
}
renderHistory();

let libIndex = new Set();
let queuedIndex = new Set();
fetch('/api/library/index').then(r => r.json()).then(items => {
  libIndex    = new Set(items.filter(i => !i.q).map(i => i.a + '||' + i.t));
  queuedIndex = new Set(items.filter(i => i.q).map(i => i.a + '||' + i.t));
}).catch(() => {});

// Hide TIDAL buttons when the monochrome instance is unreachable
fetch('/api/status/sources').then(r => r.json()).then(d => {
  if (!d.monochrome) document.body.classList.add('no-mono');
}).catch(() => {});

function setTab(tab) {
  activeTab = tab;
  tabBar.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
}

// Other tabs link here for song/artist/album pages (see songUrl & co. in
// base.html); with no link, restore the last search.
(function() {
  const P = new URLSearchParams(location.search);
  const g = k => P.get(k) || '';
  if (P.has('song')) {
    loadSong({id: g('id'), title: g('title'), artist: g('artist'), album: g('album'), cover: g('cover'),
              artist_id: g('artist_id'), album_id: g('album_id'), duration: +g('duration') || 0});
    return;
  }
  if (g('artist_id')) { loadArtist(g('artist_id'), g('name')); return; }
  if (g('album_id'))  { loadAlbum(g('album_id'), g('name'), g('artist'), g('cover')); return; }
  if (g('album_name'))  { findAndOpen('album', g('album_name'), g('artist_name')); return; }
  if (g('artist_name')) { findAndOpen('artist', g('artist_name'), ''); return; }
  const q = g('q') || sessionStorage.getItem('ss_query');
  const tab = g('type') || sessionStorage.getItem('ss_tab');
  if (q) {
    input.value = q;
    clearBtn.classList.add('visible');
    if (tab) setTab(tab);
    triggerSearch(q);
  }
})();

// A Library artist/album has a name, not a catalog id: look it up and open
// the best match, falling back to the result list.
function findAndOpen(kind, name, artist) {
  const q = kind === 'album' ? `${artist} ${name}`.trim() : name;
  input.value = q;
  clearBtn.classList.add('visible');
  setTab(kind);
  area.innerHTML = '<div class="loading"><span class="spinner"></span>Looking up…</div>';
  fetch(`/api/search?type=${kind}&q=${encodeURIComponent(q)}`).then(r => r.json()).then(items => {
    const n = s => (s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const hit = kind === 'artist'
      ? items.find(a => n(a.name) === n(name))
      : items.find(a => n(a.title) === n(name) && (!artist || n(a.artist) === n(artist)));
    if (!hit) { kind === 'artist' ? renderArtists(items) : renderAlbums(items); return; }
    if (kind === 'artist') loadArtist(hit.id, hit.name);
    else loadAlbum(hit.id, hit.title, hit.artist, hit.cover);
  }).catch(() => { area.innerHTML = '<div class="loading">Lookup failed — try again.</div>'; });
}

// ── Tabs ──────────────────────────────────────────────────────────────────
tabBar.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  sessionStorage.setItem('ss_tab', activeTab);
  navStack = [];
  renderBreadcrumb();
  const q = input.value.trim();
  if (q.length >= 2) triggerSearch(q);
});

// ── Search input ──────────────────────────────────────────────────────────
input.addEventListener('input', () => {
  clearBtn.classList.toggle('visible', input.value.length > 0);
  clearTimeout(debounce);
  const q = input.value.trim();
  if (!q) { reset(); return; }
  if (q.length < 2) return;
  navStack = [];
  renderBreadcrumb();
  debounce = setTimeout(() => triggerSearch(q), 350);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.classList.remove('visible');
  reset();
  input.focus();
});

function reset() {
  sessionStorage.removeItem('ss_query');
  sessionStorage.removeItem('ss_tab');
  navStack = [];
  renderBreadcrumb();
  area.innerHTML = '<div class="empty-state"><div class="empty-icon">' + window.icon('music', 40) + '</div><p>Search to discover music</p></div>';
}

let _searchSeq = 0;
function triggerSearch(q) {
  if (!q) { reset(); return; }
  sessionStorage.setItem('ss_query', q);
  sessionStorage.setItem('ss_tab', activeTab);
  saveHistory(q);
  area.innerHTML = '<div class="loading"><span class="spinner"></span>Searching…</div>';
  // A slow earlier query (or one for the other tab) mustn't overwrite the
  // results of the latest one.
  const seq = ++_searchSeq, tab = activeTab;
  fetch(`/api/search?q=${encodeURIComponent(q)}&type=${tab}`)
    .then(r => r.json())
    .then(data => {
      if (seq !== _searchSeq || navStack.length) return;
      if (tab === 'track')  renderTracks(data, {album:'', cover:'', artist:''});
      if (tab === 'artist') renderArtists(data);
      if (tab === 'album')  renderAlbums(data);
    })
    .catch(() => { area.innerHTML = '<div class="loading">Search failed — try again.</div>'; });
}

// ── Event delegation — handles all clicks inside results area ─────────────
area.addEventListener('click', e => {
  // Download button (track)
  const dlBtn = e.target.closest('.dl-btn');
  if (dlBtn) {
    queueDl(dlBtn, {
      title:  dlBtn.dataset.title,
      artist: dlBtn.dataset.artist,
      album:  dlBtn.dataset.album,
      cover:  dlBtn.dataset.cover,
    }, dlBtn.dataset.source);
    return;
  }
  // Download-all button (album page)
  const dlAll = e.target.closest('.dl-all-btn, [data-action="dl-all"]');
  if (dlAll) {
    const dataEl = document.getElementById('_album_tracks');
    if (dataEl) queueAll(JSON.parse(dataEl.textContent), dlAll.dataset.source);
    return;
  }
  // Artist card or artist link
  const artistEl = e.target.closest('[data-action="artist"]');
  if (artistEl) {
    loadArtist(artistEl.dataset.id, artistEl.dataset.name);
    return;
  }
  // Album card or album link
  const albumEl = e.target.closest('[data-action="album"]');
  if (albumEl) {
    loadAlbum(albumEl.dataset.id, albumEl.dataset.name, albumEl.dataset.artist, albumEl.dataset.cover);
    return;
  }
  // Anywhere else on a track row: its song page
  const songEl = e.target.closest('[data-action="song"]');
  if (songEl && !e.target.closest('button, a, audio')) {
    try { loadSong(JSON.parse(songEl.dataset.song)); } catch (err) {}
  }
});
function renderBreadcrumb() {
  if (!navStack.length) { breadcrumbEl.classList.add('hidden'); return; }
  breadcrumbEl.classList.remove('hidden');
  const parts = [
    `<a onclick="navTo(-1)">Search</a>`,
    ...navStack.map((n, i) =>
      i < navStack.length - 1
        ? `<span class="breadcrumb-sep">›</span><a onclick="navTo(${i})">${esc(n.name)}</a>`
        : `<span class="breadcrumb-sep">›</span><span class="current">${esc(n.name)}</span>`
    ),
  ];
  breadcrumbEl.innerHTML = parts.join('');
}

// Each drill-down is a history entry so the phone's back gesture steps back
// through artist/album/song pages instead of leaving Search.
function pushFrame(frame) {
  navStack.push(frame);
  try { history.pushState({sdepth: navStack.length}, ''); } catch (e) {}
  renderBreadcrumb();
}
window.addEventListener('popstate', e => {
  const d = (e.state && e.state.sdepth) || 0;
  if (d < navStack.length) navTo(d - 1, true);
  else if (d > navStack.length) history.back();   // entry left over from a reset stack
});

function navTo(idx, fromHistory) {
  // Breadcrumb taps go through history too, so Back stays in step.
  if (!fromHistory && navStack.length - (idx + 1) > 0) { history.go((idx + 1) - navStack.length); return; }
  if (idx === -1) {
    navStack = [];
    renderBreadcrumb();
    triggerSearch(input.value.trim());   // empty box → the start screen
    return;
  }
  const frame = navStack[idx];
  navStack = navStack.slice(0, idx + 1);
  renderBreadcrumb();
  frame.restore();
}

// ── Track list ────────────────────────────────────────────────────────────
function renderTracks(tracks, albumCtx) {
  if (!tracks || !tracks.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">' + window.icon('mute', 40) + '</div><p>No tracks found</p></div>';
    return;
  }
  const html = tracks.map(t => trackCardHtml({
    id: t.id,
    title: t.title,
    artist: t.artist,
    album: t.album || albumCtx.album,
    cover: t.cover || albumCtx.cover,
    duration: t.duration,
    artist_id: t.artist_id,
    album_id: t.album_id,
  })).join('');
  area.innerHTML = `<div class="card-list">${html}</div>`;
}

function trackCardHtml(t, hideDrillLinks) {
  const dur = fmtDur(t.duration);
  const libKey = (t.artist || '').toLowerCase().trim() + '||' + (t.title || '').toLowerCase().trim();
  const inLib = libIndex.has(libKey);
  const queued = !inLib && queuedIndex.has(libKey);
  const artistLink = t.artist_id && !hideDrillLinks
    ? `<span class="track-link" data-action="artist" data-id="${esc(t.artist_id)}" data-name="${esc(t.artist)}">${esc(t.artist)}</span>`
    : esc(t.artist || '');
  const albumLink = t.album_id && !hideDrillLinks
    ? ` · <span class="track-link" data-action="album" data-id="${esc(t.album_id)}" data-name="${esc(t.album)}" data-artist="${esc(t.artist)}" data-cover="${esc(t.cover||'')}">${esc(t.album)}</span>`
    : (t.album ? ` · ${esc(t.album)}` : '');
  const badge = inLib ? ' <span class="in-lib-badge">✓ Library</span>'
              : queued ? ' <span class="in-lib-badge">⏳ Queued</span>' : '';
  const dlBtns = queued
    ? `<span style="color:var(--text-muted);font-size:.75rem;white-space:nowrap">⏳ In queue</span>`
    : `
      <button class="btn btn-slsk dl-btn"
        data-source="slskd"
        data-title="${esc(t.title)}"
        data-artist="${esc(t.artist||'')}"
        data-album="${esc(t.album||'')}"
        data-cover="${esc(t.cover||'')}">Soulseek</button>
      <button class="btn btn-mono dl-btn"
        data-source="monochrome"
        data-title="${esc(t.title)}"
        data-artist="${esc(t.artist||'')}"
        data-album="${esc(t.album||'')}"
        data-cover="${esc(t.cover||'')}">TIDAL</button>`;
  return `
  <div class="track-card${inLib ? ' track-in-lib' : ''}" data-action="song" data-song="${esc(JSON.stringify(t))}">
    ${t.cover
      ? `<img class="cover" src="${esc(t.cover)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="cover-placeholder" style="display:none">${window.icon('music', 18)}</div>`
      : `<div class="cover-placeholder">${window.icon('music', 18)}</div>`}
    <div class="track-info">
      <div class="track-title">${esc(t.title)}${badge}</div>
      <div class="track-sub">${artistLink}${albumLink}</div>
    </div>
    ${dur ? `<span class="track-dur">${dur}</span>` : ''}
    <div class="dl-btns">${dlBtns}</div>
  </div>`;
}

// ── Artist list ───────────────────────────────────────────────────────────
function renderArtists(artists) {
  if (!artists || !artists.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">' + window.icon('mute', 40) + '</div><p>No artists found</p></div>';
    return;
  }
  const html = artists.map(a => `
    <div class="artist-card" data-action="artist" data-id="${esc(a.id)}" data-name="${esc(a.name)}">
      ${a.picture
        ? `<img class="artist-pic" src="${esc(a.picture)}" alt="" loading="lazy">`
        : `<div class="artist-pic placeholder">${window.icon('user', 26)}</div>`}
      <div class="track-info">
        <div class="artist-name">${esc(a.name)}</div>
        ${a.nb_album ? `<div class="artist-sub">${a.nb_album} albums</div>` : ''}
      </div>
      <span class="chevron">›</span>
    </div>`).join('');
  area.innerHTML = `<div class="card-list">${html}</div>`;
}

function loadArtist(id, name, restoring) {
  if (!restoring) pushFrame({ name, restore: () => loadArtist(id, name, true) });
  area.innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';
  fetch(`/api/artist/${id}`)
    .then(r => r.json())
    .then(data => renderArtistPage(data))
    .catch(() => { area.innerHTML = '<div class="loading">Failed to load artist.</div>'; });
}

function renderArtistPage(data) {
  if (data.error) { area.innerHTML = `<div class="loading">${esc(data.error)}</div>`; return; }

  const fansStr = data.nb_fan > 1e6
    ? (data.nb_fan / 1e6).toFixed(1) + 'M fans'
    : data.nb_fan > 1e3
    ? Math.round(data.nb_fan / 1e3) + 'K fans'
    : (data.nb_fan || '') + ' fans';

  const hero = `
    <div class="artist-hero">
      ${data.picture
        ? `<img class="artist-hero-img" src="${esc(data.picture)}" alt=""
              onerror="this.style.display='none'">`
        : ''}
      <div class="artist-hero-overlay">
        <div class="artist-hero-name">${esc(data.name)}</div>
        ${data.nb_fan ? `<div class="artist-hero-fans">${fansStr}</div>` : ''}
      </div>
    </div>`;

  let topSection = '';
  if (data.top_tracks && data.top_tracks.length) {
    const rows = data.top_tracks.map((t, i) => {
      const libKey = (t.artist || '').toLowerCase().trim() + '||' + (t.title || '').toLowerCase().trim();
      const inLib = libIndex.has(libKey);
      const queued = !inLib && queuedIndex.has(libKey);
      const btns = queued
        ? `<span style="color:var(--text-muted);font-size:.75rem;white-space:nowrap">⏳ queued</span>`
        : `
          <button class="btn btn-slsk dl-btn" data-source="slskd"
            data-title="${esc(t.title)}" data-artist="${esc(t.artist||'')}"
            data-album="${esc(t.album||'')}" data-cover="${esc(t.cover||'')}">SLSK</button>
          <button class="btn btn-mono dl-btn" data-source="monochrome"
            data-title="${esc(t.title)}" data-artist="${esc(t.artist||'')}"
            data-album="${esc(t.album||'')}" data-cover="${esc(t.cover||'')}">TIDAL</button>`;
      return `
      <div class="top-track-row${inLib ? ' track-in-lib' : ''}" data-action="song" data-song="${esc(JSON.stringify(t))}">
        <span class="top-track-num">${i + 1}</span>
        <div class="top-track-info">
          <div class="top-track-title">${esc(t.title)}${inLib ? ' <span class="in-lib-badge">✓</span>' : queued ? ' <span class="in-lib-badge">⏳</span>' : ''}</div>
          ${t.album ? `<div class="top-track-album">${esc(t.album)}</div>` : ''}
        </div>
        <span class="top-track-dur">${fmtDur(t.duration)}</span>
        <div class="dl-btns">${btns}</div>
      </div>`;
    }).join('');
    topSection = `<div class="section-label" style="margin:.9rem 0 .4rem">Popular Tracks</div>
      <div class="top-tracks-list">${rows}</div>`;
  }

  const albumsHtml = (data.albums || []).map(a => `
    <div class="album-card" data-action="album" data-id="${esc(a.id)}" data-name="${esc(a.title)}" data-artist="${esc(data.name)}" data-cover="${esc(a.cover)}">
      ${a.cover
        ? `<img class="album-cover" src="${esc(a.cover)}" alt="" loading="lazy">`
        : `<div class="album-cover-ph">${window.icon('disc', 26)}</div>`}
      <div class="album-title">${esc(a.title)}</div>
      <div class="album-sub">${a.release_date ? a.release_date.slice(0,4) : ''}${a.nb_tracks ? ` · ${a.nb_tracks} tr` : ''}</div>
    </div>`).join('');
  const albumsSection = albumsHtml
    ? `<div class="section-label" style="margin:.9rem 0 .4rem">Albums</div><div class="album-grid">${albumsHtml}</div>`
    : '';

  area.innerHTML = hero + topSection + albumsSection;
}

// ── Album list ────────────────────────────────────────────────────────────
function renderAlbums(albums) {
  if (!albums || !albums.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">' + window.icon('mute', 40) + '</div><p>No albums found</p></div>';
    return;
  }
  const html = albums.map(a => `
    <div class="album-card" data-action="album" data-id="${esc(a.id)}" data-name="${esc(a.title)}" data-artist="${esc(a.artist)}" data-cover="${esc(a.cover)}">
      ${a.cover
        ? `<img class="album-cover" src="${esc(a.cover)}" alt="" loading="lazy">`
        : `<div class="album-cover-ph">${window.icon('disc', 26)}</div>`}
      <div class="album-title">${esc(a.title)}</div>
      <div class="album-sub">${esc(a.artist)}${a.nb_tracks ? ` · ${a.nb_tracks} tracks` : ''}</div>
    </div>`).join('');
  area.innerHTML = `<div class="album-grid">${html}</div>`;
}

function loadAlbum(id, title, artist, cover, restoring) {
  if (!restoring) pushFrame({ name: title, restore: () => loadAlbum(id, title, artist, cover, true) });
  area.innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';
  fetch(`/api/album/${id}`)
    .then(r => r.json())
    .then(data => renderAlbumPage(data, cover))
    .catch(() => { area.innerHTML = '<div class="loading">Failed to load album.</div>'; });
}

function renderAlbumPage(data, fallbackCover) {
  if (data.error) { area.innerHTML = `<div class="loading">${esc(data.error)}</div>`; return; }
  const cover = data.cover || fallbackCover || '';
  const allTracks = data.tracks.map(t => ({
    title: t.title, artist: t.artist || data.artist, album: data.title, cover,
  }));

  const header = `
    <script type="application/json" id="_album_tracks">${JSON.stringify(allTracks)}<\/script>
    <div class="album-header">
      ${cover
        ? `<img class="album-header-cover" src="${esc(cover)}" alt="">`
        : `<div class="album-header-cover-ph">${window.icon('disc', 32)}</div>`}
      <div class="album-header-info">
        <div class="album-header-title">${esc(data.title)}</div>
        <div class="album-header-artist">${data.artist_id
          ? `<span class="track-link" data-action="artist" data-id="${esc(data.artist_id)}" data-name="${esc(data.artist)}">${esc(data.artist)}</span>`
          : esc(data.artist)}</div>
        <div class="album-sub" style="margin-top:4px;white-space:normal">${[
          data.record_type && data.record_type !== 'album' ? data.record_type.toUpperCase() : '',
          (data.release_date || '').slice(0, 4),
          data.tracks.length ? `${data.tracks.length} songs` : '',
          data.duration ? fmtLong(data.duration) : '',
        ].filter(Boolean).join(' · ')}</div>
        ${data.label || (data.genres || []).length ? `<div class="album-sub" style="white-space:normal">${esc([(data.genres || []).join(', '), data.label].filter(Boolean).join(' · '))}</div>` : ''}
        ${(() => {
          const have = data.tracks.filter(t => libIndex.has(libKeyOf(t.artist || data.artist, t.title))).length;
          return `<div class="album-sub" style="margin-top:4px;color:${have === data.tracks.length && have ? 'var(--ok)' : 'var(--text-muted)'}">${
            have ? `✓ You have ${have} of ${data.tracks.length}` : 'None of these in your library yet'}</div>`;
        })()}
      </div>
    </div>
    <div class="dl-all-row">
      <button class="btn-dl-all btn-slsk dl-all-btn" data-source="slskd">⬇ All via Soulseek</button>
      <button class="btn-dl-all btn-mono dl-all-btn" data-source="monochrome">⬇ All via TIDAL</button>
    </div>`;

  const tracks = data.tracks.map(t => trackCardHtml({
    id: t.id,
    title: t.title,
    artist: t.artist || data.artist,
    artist_id: data.artist_id,
    album: data.title,
    album_id: data.id,
    cover,
    duration: t.duration,
  }, true)).join('');

  area.innerHTML = header + `<div class="card-list">${tracks}</div>`;
}

// ── Download actions ──────────────────────────────────────────────────────
function queueDl(btn, item, source) {
  btn.textContent = '…';
  btn.disabled = true;
  fetch('/api/download', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      artist: item.artist,
      album: item.album,
      title: item.title,
      cover: item.cover,
      source,
    }),
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      btn.textContent = '✓';
      btn.classList.add('btn-queued');
      showToast('Queued: ' + item.title);
    } else if (d.skipped) {
      btn.textContent = '✓';
      btn.classList.add('btn-queued');
      showToast(d.message || 'Already in your library');
    } else {
      btn.textContent = '✗';
      showToast('Error: ' + (d.message || d.error || 'Unknown'), 3500);
      setTimeout(() => { btn.textContent = source === 'slskd' ? 'Soulseek' : 'TIDAL'; btn.disabled = false; }, 2000);
    }
  })
  .catch(() => {
    btn.textContent = source === 'slskd' ? 'Soulseek' : 'TIDAL';
    btn.disabled = false;
    showToast('Network error', 3000);
  });
}

function queueAll(tracks, source) {
  showToast(`Queueing ${tracks.length} tracks…`);
  fetch('/api/download/album', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ tracks, source }),
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) showToast(`Queued ${d.count} tracks via ${source === 'slskd' ? 'Soulseek' : 'TIDAL'} ✓`);
    else showToast('Error: ' + (d.error || 'Unknown'), 3500);
  })
  .catch(() => showToast('Network error', 3000));
}

// ── Song page ─────────────────────────────────────────────────────────────
// Everything about one song in one place: whether you have it (and a way to
// its Library entry to ID/rename it), a 30-second preview to check by ear,
// release and credits, the rest of its album and more by the artist.
function libKeyOf(artist, title) {
  return (artist || '').toLowerCase().trim() + '||' + (title || '').toLowerCase().trim();
}

function loadSong(t, restoring) {
  if (!restoring) pushFrame({ name: t.title || 'Song', restore: () => loadSong(t, true) });
  renderSongPage(t, null);
  const withId = t.id ? Promise.resolve(t.id)
    // Arrived from Queue/Library with just a name: find it in the catalog.
    : fetch(`/api/search?type=track&q=${encodeURIComponent(`${t.artist} ${t.title}`)}`)
        .then(r => r.json()).then(items => {
          const n = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          const hit = items.find(i => n(i.title) === n(t.title) && n(i.artist) === n(t.artist))
                   || items.find(i => n(i.title).includes(n(t.title)) && n(i.artist) === n(t.artist));
          return hit ? hit.id : '';
        });
  withId.then(id => id ? fetch(`/api/track/${id}`).then(r => r.json()) : null)
    .then(d => {
      if (navStack[navStack.length - 1]?.name !== (t.title || 'Song')) return;   // navigated away
      if (d && !d.error) renderSongPage(Object.assign({}, t, d), d);
      else renderSongPage(t, {});
    }).catch(() => renderSongPage(t, {}));
}

function renderSongPage(t, d) {
  const key = libKeyOf(t.artist, t.title);
  const inLib = libIndex.has(key), queued = !inLib && queuedIndex.has(key);
  const cover = t.cover || '';
  const status = inLib
    ? `<div class="song-status ok">✓ In your library
         <a class="song-status-link" href="${esc(libraryUrl({song: t.artist + '||' + t.title}))}">Open · ID · rename ›</a></div>`
    : queued
    ? `<div class="song-status">⏳ In your queue <a class="song-status-link" href="/">Queue ›</a></div>`
    : '';
  const meta = [fmtDur(t.duration), (t.release_date || '').slice(0, 4), t.explicit ? 'Explicit' : '']
    .filter(Boolean).join(' · ');
  const facts = [];
  if (d && d.release_date) facts.push(['Released', d.release_date]);
  if (d && d.track_position) facts.push(['Track', `${d.track_position}${d.disk_number > 1 ? ` (disc ${d.disk_number})` : ''}`]);
  if (d && d.bpm) facts.push(['BPM', Math.round(d.bpm)]);
  if (d && d.isrc) facts.push(['ISRC', d.isrc]);
  const credits = d && (d.contributors || []).filter(c => c.name && c.name !== t.artist);
  if (credits && credits.length) facts.push(['With', credits.map(c => c.name).join(', ')]);

  area.innerHTML = `
    <div class="song-hero">
      ${cover ? `<img class="song-cover" src="${esc(cover)}" alt="" onerror="this.style.visibility='hidden'">`
              : `<div class="song-cover song-cover-ph">${window.icon('music', 40)}</div>`}
      <div class="song-hero-info">
        <div class="song-kicker">Song</div>
        <h1 class="song-title">${esc(t.title)}${t.title_version && !t.title.includes(t.title_version) ? ` <span class="song-version">${esc(t.title_version)}</span>` : ''}</h1>
        <div class="song-by">${t.artist_id
          ? `<span class="track-link" data-action="artist" data-id="${esc(t.artist_id)}" data-name="${esc(t.artist)}">${esc(t.artist)}</span>`
          : esc(t.artist)}${t.album ? ' · ' + (t.album_id
          ? `<span class="track-link" data-action="album" data-id="${esc(t.album_id)}" data-name="${esc(t.album)}" data-artist="${esc(t.artist)}" data-cover="${esc(cover)}">${esc(t.album)}</span>`
          : esc(t.album)) : ''}</div>
        ${meta ? `<div class="song-meta">${esc(meta)}</div>` : ''}
      </div>
    </div>
    ${status}
    ${d && d.preview ? `<audio class="song-preview" controls preload="none" src="${esc(d.preview)}"></audio>
       <div class="song-hint">30-second preview — handy for checking a download by ear.</div>` : ''}
    ${queued ? '' : `<div class="dl-all-row">
      <button class="btn-dl-all btn-slsk dl-btn" data-source="slskd" data-title="${esc(t.title)}"
        data-artist="${esc(t.artist || '')}" data-album="${esc(t.album || '')}" data-cover="${esc(cover)}">⬇ Soulseek</button>
      <button class="btn-dl-all btn-mono dl-btn" data-source="monochrome" data-title="${esc(t.title)}"
        data-artist="${esc(t.artist || '')}" data-album="${esc(t.album || '')}" data-cover="${esc(cover)}">⬇ TIDAL</button>
    </div>`}
    ${facts.length ? `<div class="song-facts">${facts.map(([k, v]) =>
      `<span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span>`).join('')}</div>` : ''}
    ${d === null ? '<div class="loading"><span class="spinner"></span>Loading details…</div>' : ''}
    <div id="song-album"></div>
    <div id="song-more"></div>`;

  if (!d) return;
  const albumId = t.album_id || d.album_id, artistId = t.artist_id || d.artist_id;
  if (albumId) fetch(`/api/album/${albumId}`).then(r => r.json()).then(a => {
    const el = document.getElementById('song-album');
    if (!el || a.error || !(a.tracks || []).length) return;
    el.innerHTML = `<div class="section-label song-section">On ${esc(a.title)}
        <span class="track-link" data-action="album" data-id="${esc(a.id)}" data-name="${esc(a.title)}" data-artist="${esc(a.artist)}" data-cover="${esc(a.cover)}">Full album ›</span></div>
      <div class="card-list">${a.tracks.map(x => trackCardHtml({
        id: x.id, title: x.title, artist: x.artist || a.artist, artist_id: a.artist_id,
        album: a.title, album_id: a.id, cover: a.cover, duration: x.duration,
      }, true).replace('class="track-card', x.id === String(t.id || d.id) ? 'class="track-card track-current' : 'class="track-card')).join('')}</div>`;
  }).catch(() => {});
  if (artistId) fetch(`/api/artist/${artistId}`).then(r => r.json()).then(a => {
    const el = document.getElementById('song-more');
    const top = (a.top_tracks || []).filter(x => x.id !== String(t.id || d.id)).slice(0, 5);
    if (!el || a.error || !top.length) return;
    el.innerHTML = `<div class="section-label song-section">More by ${esc(a.name)}
        <span class="track-link" data-action="artist" data-id="${esc(a.id)}" data-name="${esc(a.name)}">Artist ›</span></div>
      <div class="card-list">${top.map(x => trackCardHtml(x)).join('')}</div>`;
  }).catch(() => {});
}

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtLong(s) {
  const m = Math.round(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}

function fmtDur(s) {
  if (!s) return '';
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
